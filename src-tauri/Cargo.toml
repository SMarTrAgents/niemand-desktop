[package]
name = "niemand-desktop"
version = "0.2.0"
description = "Niemand — der weiße Hase von SMarTrAgents als Desktop-Tierchen"
authors = ["SMarTrAgents"]
edition = "2021"

[lib]
name = "niemand_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Kleines, schnelles Dauerläufer-Binary
codegen-units = 1
lto = true
strip = true
