# One-Click-Installer für alle drei Systeme.
# Läuft bei jedem Versions-Tag (v*) und auf Knopfdruck; erzeugt einen
# Release-ENTWURF mit .exe (NSIS), .dmg (universal), .deb und .AppImage.
# Veröffentlicht wird der Entwurf von Hand — nichts geht ungeprüft raus.
name: build-installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux-Systempakete (webkit2gtk, appindicator)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Niemand ${{ github.ref_name }}"
          releaseBody: "Ein Klick, fertig: Installer unten auswählen. Windows meldet sich beim ersten Start eventuell mit einem Hinweis — Anleitung im README."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
